<html lang='es'>

<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>tableroKanban</title>
    <link rel='stylesheet' href='style.css'>
    <script src='script.js' defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

</head>

<body>
    <h1>Tablero Kanban</h1>
    <div class="selectorFondo">
        <span class="colorFondo activo" data-color="#4a3da5" style="background:#4a3da5"></span>
        <span class="colorFondo" data-color="#1565c0" style="background:#1565c0"></span>
        <span class="colorFondo" data-color="#2e7d32" style="background:#2e7d32"></span>
        <span class="colorFondo" data-color="#880e4f" style="background:#880e4f"></span>
        <span class="colorFondo" data-color="#e65100" style="background:#e65100"></span>
        <span class="colorFondo" data-color="#37474f" style="background:#37474f"></span>
    </div>
    <div class="contenedor">

        <div class="columna" id="toDoColumn">
            <h2>To Do</h2>
            <section class="tarjetas dropzone"></section>
            <div class="divOpenForm">
                <a class="openForm">+ Añadir nueva tarjeta</a>
            </div>
            <div class="divForm disabled">
                <textarea class="textoTarjeta" rows="3" cols="40" placeholder="Escribe aquí tu tarjeta..."></textarea>
                <div class="botones">
                    <button class="botonAdd">Añadir</button>
                    <a class="botonCancelar">x</a>
                </div>
            </div>
        </div>

        <div class="columna" id="doingColumn">
            <h2>Doing</h2>
            <section class="tarjetas dropzone"></section>
            <div class="divOpenForm">
                <a class="openForm">+ Añadir nueva tarjeta</a>
            </div>
            <div class="divForm disabled">
                <textarea class="textoTarjeta" rows="3" cols="40" placeholder="Escribe aquí tu tarjeta..."></textarea>
                <div class="botones">
                    <button class="botonAdd">Añadir</button>
                    <a class="botonCancelar">x</a>
                </div>
            </div>
        </div>

        <div class="columna" id="doneColumn">
            <h2>Done</h2>
            <section class="tarjetas dropzone"></section>
            <div class="divOpenForm">
                <a class="openForm">+ Añadir nueva tarjeta</a>
            </div>
            <div class="divForm disabled">
                <textarea class="textoTarjeta" rows="3" cols="40" placeholder="Escribe aquí tu tarjeta..."></textarea>
                <div class="botones">
                    <button class="botonAdd">Añadir</button>
                    <a class="botonCancelar">x</a>
                </div>
            </div>
        </div>
        
    </div>
    <footer>Gloria Curado García ©</footer>

</body>

</html>
